name: build, test & release

on:
  push:
    branches: ["master"]
    tags:
      - "v*"          # workflow juga jalan kalau push tag seperti v1.0.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4   # <- v4
        with:
          name: publish
          path: ./publish

  release:
    needs: build
    runs-on: ubuntu-latest
    # hanya jalan kalau event-nya push tag (refs/tags/...)
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4   # <- v4
        with:
          name: publish
          path: ./publish

      - name: Buat file zip untuk release
        run: |
          zip -r publish.zip ./publish

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}          # contoh: v1.0.0
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload asset ke Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./publish.zip
          asset_name: publish.zip
          asset_content_type: application/zip
